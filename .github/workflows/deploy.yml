# Publica no Cloudflare Pages a cada push na main (produção) ou em outros ramos (preview).
# Segredos do repositório: CLOUDFLARE_API_TOKEN (Account › Cloudflare Pages › Edit) e CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar no Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy public --project-name=lucasmagdiel --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
