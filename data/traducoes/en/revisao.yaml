# English version of data/revisao.yaml: text fields only, keyed by item id (same order as the original).
# `titulo` only where it is descriptive (book titles and plain publisher names stay as in the original).
# `titulos`: same order and length as the original list; {} = item with no text to translate.

vania-vidal-narciso:
  papel: "copyediting"
  genero: "poetry (bilingual edition)"
  sinopse: "A poetry collection by Vânia Vidal in a bilingual edition. The poems draw on well-known figures from Western culture to explore identity and narcissism, and also deal with farewells and the closing of chapters in life."

vania-vidal-paragate:
  papel: "copyediting"
  genero: "poetry"
  sinopse: "A poetry collection by Vânia Vidal, a historian, paleographer, and teacher based in Rio de Janeiro. The poems explore in-between states, such as that of someone moving between places and senses of belonging, and make room for women's experience."

vania-vidal-a-mulher-de-mocassins:
  papel: "copyediting"
  genero: "poetry"
  sinopse: "A collection of poems Vânia Vidal wrote at different stages of her life. The body, the senses, and the passage of time are the book's main threads."

vania-vidal-academicos:
  titulo: "Academic texts by Vânia Vidal (2025)"
  itens:
