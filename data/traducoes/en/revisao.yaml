    - "Article “A singularidade da tradução de D. Pedro de Avis do De Officiis de Cícero” in the proceedings of the Simpósio Internacional da Contemporaneidade à Antiguidade (UFG/University of Coimbra, 2025)"
  papel: "proofreading"

