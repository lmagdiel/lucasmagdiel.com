noturna-e-outros-poemas:
  papel: "corrección"
  genero: "poesía"
  sinopse: "Primer libro del poeta Cláudio Duffrayer, de Río de Janeiro: 22 poemas en verso y prosa poética, con ilustraciones de Thaís Melo, en diálogo con el simbolismo y la literatura fantástica del siglo XIX."

papos-contemporaneos:
  papel: "entrevista a la poeta Claudia Roquette-Pinto y corrección de estilo (curso de extensión universitaria, 2006)"
  sinopse: "Doce entrevistas con escritores brasileños contemporáneos, como Ferreira Gullar, Claudia Roquette-Pinto, Antonio Carlos Secchin y Sérgio Sant'Anna, realizadas, transcritas y editadas por estudiantes de la Facultad de Letras de la UFRJ en un curso coordinado por Dau Bastos."

