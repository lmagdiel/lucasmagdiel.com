# Traducción al español (neutro latinoamericano) de data/revisao.yaml.
# Claves: el id de cada elemento del original, en el mismo orden. Solo los campos de texto traducidos.
# titulo: solo los títulos descriptivos de grupo (los títulos de libros no se traducen).
# titulos: mismo orden y tamaño que en el original; {} para los elementos sin papel, sinopse ni nota.

vania-vidal-narciso:
  papel: "corrección de estilo"
  genero: "poesía (edición bilingüe)"
  sinopse: "Libro de poemas de Vânia Vidal, en edición bilingüe. Los textos recurren a personajes conocidos de la cultura occidental para reflexionar sobre la identidad y el narcisismo, y abordan también las despedidas y el cierre de ciclos."

vania-vidal-paragate:
  papel: "corrección de estilo"
  genero: "poesía"
  sinopse: "Libro de poemas de Vânia Vidal, historiadora, paleógrafa y profesora radicada en Río de Janeiro. Los poemas exploran estados intermedios, como el de quien transita entre lugares y pertenencias, y dan espacio a la experiencia femenina."

vania-vidal-a-mulher-de-mocassins:
  papel: "corrección de estilo"
  genero: "poesía"
  sinopse: "Recopilación de poemas de Vânia Vidal escritos en distintas etapas de la vida de la autora. El cuerpo, los sentidos y el paso del tiempo son los ejes del libro."

vania-vidal-academicos:
  titulo: "Textos académicos de Vânia Vidal (2025)"
  itens:
    - "Capítulo “O discurso sobre a temperança, a moderação e a prudência no De Officiis, de Cícero”, en Estudos da Antiguidade e do Medievo em Transição (Mundo Acadêmico/Casaletras, 2025), pp. 343–352"
    - "Artículo “A singularidade da tradução de D. Pedro de Avis do De Officiis de Cícero”, en las actas del Simpósio Internacional da Contemporaneidade à Antiguidade (UFG/Universidade de Coimbra, 2025)"
  papel: "corrección"

