  papel: "corrección"
  titulos:
    - {sinopse: "Libro-reportaje sobre el verano de 1987 a 1988, cuando latas de marihuana arrojadas al mar desde el barco Solana Star llegaron a las costas del Sudeste y del Sur de Brasil."}
