# Cada ítem: nome, papel (línea corta), icone (assets/img/setup/<icone>.svg), specs (lista corta), nota (opcional: ruta de una nota).
# Orden de las specs en las computadoras: gabinete, placa madre, procesador, memoria, almacenamiento, fuente, conectividad, sistema, pendrive de arranque.
