  sinopse: "Prólogo escrito em 1997 para o dicionário Clave, da editora espanhola SM, inédito em português até esta tradução. García Márquez recorda o avô que, corrigido num circo sobre um dromedário, foi tirar a dúvida no dicionário; compara definições de “amarelo” de 1611 a 1976, elogia o trabalho solitário de María Moliner e defende dicionários pensados também para crianças."
