{{- $rot := .Get 1 | default (i18n "leia_mais") }}
{{- $r := partial "pagina.html" (.Get 0) }}
{{- with $r.p }}
<p class="leia-mais"><a href="{{ .RelPermalink }}"{{ if $r.outro }} hreflang="{{ .Language.Locale }}"{{ end }}>{{ $rot }}{{ if $r.outro }} {{ i18n "em_portugues" }}{{ end }} <span aria-hidden="true">→</span></a></p>
{{- end }}
