{{- /* Ilustração em faixa escura, sem legenda.
       Uso: {{< ilustracao img="img/....svg" alt="..." >}} */ -}}
{{- with resources.Get (.Get "img") }}
<figure class="ilustr">
  {{- if eq .MediaType.SubType "svg" }}
  <img src="{{ .RelPermalink }}" width="800" height="280" alt="{{ $.Get "alt" }}" decoding="async">
  {{- else }}
  {{- $i := .Resize "1280x webp q82" }}
  <img src="{{ $i.RelPermalink }}" width="{{ $i.Width }}" height="{{ $i.Height }}" alt="{{ $.Get "alt" }}" decoding="async">
  {{- end }}
</figure>
{{- end }}
