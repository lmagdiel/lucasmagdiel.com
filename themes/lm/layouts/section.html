{{ define "main" }}
<section class="secao">
  <header class="secao-cab">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>
  {{- with .Pages }}
  {{- if eq $.Section "notas" }}{{ partial "assuntos-todos.html" (dict) }}{{ end }}
  {{ partial "lista-notas.html" . }}
  {{- else }}
  <p class="vazio">{{ i18n "sem_notas" }}</p>
  {{- end }}
</section>
{{ end }}
