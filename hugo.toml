baseURL = "https://lucasmagdiel.com/"
title = "Lucas Magdiel"
theme = "lm"
enableRobotsTXT = true
enableGitInfo = false
removePathAccents = true   # /assuntos/traducao/ em vez de /assuntos/tradução/

timeZone = "America/Sao_Paulo"

defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false

[languages]
  [languages.pt]
    locale = "pt-BR"
    label = "Português"
    weight = 1
  # EN e ES ficam prontos na estrutura e entram depois do lançamento.
  [languages.en]
    locale = "en"
    label = "English"
    weight = 2
    disabled = true
  [languages.es]
    locale = "es"
    label = "Español"
    weight = 3
    disabled = true

[params]
  description = "Tradutor e legendador (inglês e espanhol). Livros, séries, documentários e jornalismo; tecnologia aplicada à tradução."
  author = "Lucas Magdiel"
  # Sem e-mail visível no site: contato só pelo formulário (evita spam).
  # Formulário de contato (Cloudflare Pages Function em /api/contato).
  contactEndpoint = "/api/contato"
  turnstileSiteKey = "0x4AAAAAAFE1POpzGlw4KI4L"   # site key do Turnstile (pública; o segredo fica no Cloudflare)
  [params.links]
    # Só aparecem com ativo = true (perfil atualizado / conteúdo público); ordem no rodapé pelo peso.
    [params.links.linkedin]
      url = "https://www.linkedin.com/in/lucasmagdiel/"
      nome = "LinkedIn"
      peso = 1
      ativo = true
    [params.links.proz]
      url = "https://www.proz.com/profile/889544"
      nome = "ProZ"
      peso = 2
      ativo = true
    [params.links.github]
      url = "https://github.com/lmagdiel"
      nome = "GitHub"
      peso = 3
      ativo = true

[menus]
  [[menus.main]]
    name = "Portfólio"
    pageRef = "/portfolio"
    weight = 10
  [[menus.main]]
    name = "Tecnologia"
    pageRef = "/tecnologia"
    weight = 20
  [[menus.main]]
    name = "Sobre"
    pageRef = "/sobre"
    weight = 30
  [[menus.main]]
    name = "Notas"
    pageRef = "/notas"
    weight = 40
  [[menus.main]]
    name = "Contato"
    pageRef = "/contato"
    weight = 50

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.extensions.typographer]
  disable = false

[imaging]
  resampleFilter = "Lanczos"
  anchor = "Smart"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 82

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changeFreq = "monthly"

[build]
  writeStats = false

# Assuntos das Notas (botões nas notas e na lista). Só esta taxonomia: sem tags/categorias padrão.
[taxonomies]
  assunto = "assuntos"

# Os assuntos ficam dentro de /notas/ (o menu marca Notas também nessas páginas).
[permalinks]
  [permalinks.taxonomy]
    assuntos = "/notas/assuntos/"
  [permalinks.term]
    assuntos = "/notas/assuntos/:slug/"
