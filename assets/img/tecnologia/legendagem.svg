  <rect x="432" y="398" width="184" height="76" rx="5" fill="#232320" stroke="#7fbcc2" stroke-width="1.5"/>
  <rect x="624" y="398" width="128" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text class="s" x="62" y="429" font-size="15" fill="#f3f0ea" opacity="0.85">Don't be late</text>
  <text class="s" x="62" y="450" font-size="15" fill="#f3f0ea" opacity="0.85">this time.</text>
  <text class="s" x="254" y="429" font-size="15" fill="#b4afa6">Não se atrase</text>
  <text class="s" x="254" y="450" font-size="15" fill="#b4afa6">desta vez.</text>
  <text class="s" x="446" y="429" font-size="14" fill="#f3f0ea" font-weight="600">Dessa vez,</text>
  <text class="s" x="446" y="450" font-size="14" fill="#f3f0ea" font-weight="600">não se atrase.</text>
  <text class="m" x="638" y="429" font-size="13" fill="#b4afa6">CPS 13,5</text>
