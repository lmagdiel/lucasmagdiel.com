  <rect x="624" y="314" width="128" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text class="s" x="62" y="345" font-size="15" fill="#f3f0ea" opacity="0.85">Then it's settled.</text>
  <text class="s" x="254" y="345" font-size="15" fill="#b4afa6">Então está</text>
  <text class="s" x="254" y="366" font-size="15" fill="#b4afa6">resolvido.</text>
  <text class="s" x="446" y="345" font-size="14" fill="#f3f0ea" font-weight="600">Então está</text>
  <text class="s" x="446" y="366" font-size="14" fill="#f3f0ea" font-weight="600">combinado.</text>
  <text class="m" x="638" y="345" font-size="13" fill="#b4afa6">CPS 12,1</text>
  <text class="m" x="638" y="366" font-size="13" fill="#b4afa6">CPL 21</text>
