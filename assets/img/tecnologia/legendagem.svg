  <text class="s" x="62" y="177" font-size="15" fill="#f3f0ea" opacity="0.85">Are you coming</text>
  <text class="s" x="62" y="198" font-size="15" fill="#f3f0ea" opacity="0.85">tomorrow?</text>
  <text class="s" x="254" y="177" font-size="15" fill="#b4afa6">Você vem amanhã?</text>
  <text class="s" x="446" y="177" font-size="14" fill="#f3f0ea" font-weight="600">Você vem amanhã?</text>
  <text class="m" x="638" y="177" font-size="13" fill="#b4afa6">CPS 11,2</text>
  <text class="m" x="638" y="198" font-size="13" fill="#b4afa6">CPL 16</text>
  <circle cx="734" cy="172" r="5" fill="#7fbcc2"/>
  <rect x="48" y="230" width="184" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <rect x="240" y="230" width="184" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <rect x="432" y="230" width="184" height="76" rx="5" fill="#232320" stroke="#7fbcc2" stroke-width="1.5"/>
  <rect x="624" y="230" width="128" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text class="s" x="62" y="261" font-size="15" fill="#f3f0ea" opacity="0.85">I wouldn't miss it</text>
  <text class="s" x="62" y="282" font-size="15" fill="#f3f0ea" opacity="0.85">for the world.</text>
  <text class="s" x="254" y="261" font-size="15" fill="#b4afa6">Eu não perderia isso</text>
  <text class="s" x="254" y="282" font-size="15" fill="#b4afa6">pelo mundo.</text>
  <text class="s" x="446" y="261" font-size="14" fill="#f3f0ea" font-weight="600">Não perco</text>
  <text class="s" x="446" y="282" font-size="14" fill="#f3f0ea" font-weight="600">por nada.</text>
  <text class="m" x="638" y="261" font-size="13" fill="#b4afa6">CPS 9,8</text>
  <text class="m" x="638" y="282" font-size="13" fill="#b4afa6">CPL 19</text>
  <circle cx="734" cy="256" r="5" fill="#7fbcc2"/>
  <rect x="48" y="314" width="184" height="76" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
