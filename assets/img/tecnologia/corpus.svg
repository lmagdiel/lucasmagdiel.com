<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <defs>
    <style>
      .mono{font-family:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Menlo,Consolas,monospace;letter-spacing:.06em}
      text{font-family:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;font-size:18px;fill:#f3f0ea}
      text.mono{font-size:15px}
    </style>
  </defs>
  <text class="mono" x="48" y="146.0" style="fill:#d6aa48">EN</text>
  <text class="mono" x="448" y="146.0" style="fill:#d6aa48">PT-BR</text>
  <line x1="352" y1="196.0" x2="448" y2="196.0" stroke="#7fbcc2" stroke-width="2"/>
  <rect x="48" y="174.0" width="304" height="44" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="66" y="204.0">Down, down, down.</text>
  <rect x="448" y="174.0" width="304" height="44" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="466" y="204.0">Caindo, caindo, caindo.</text>
  <rect x="372" y="184.0" width="56" height="24" rx="12" fill="#181816" stroke="#7fbcc2" stroke-width="1.5"/>
  <text class="mono" x="400" y="201.0" text-anchor="middle" style="fill:#7fbcc2;font-size:13px">0,98</text>
  <line x1="352" y1="289.0" x2="448" y2="289.0" stroke="#7fbcc2" stroke-width="2"/>
  <rect x="48" y="240.0" width="304" height="98" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="66" y="270.0">There was nothing else to</text>
  <text x="66" y="297.0">do, so Alice soon began</text>
  <text x="66" y="324.0">talking again.</text>
  <rect x="448" y="240.0" width="304" height="98" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="466" y="270.0">Não havia mais nada a</text>
  <text x="466" y="297.0">fazer, então Alice logo</text>
  <text x="466" y="324.0">voltou a falar.</text>
  <rect x="372" y="277.0" width="56" height="24" rx="12" fill="#181816" stroke="#7fbcc2" stroke-width="1.5"/>
  <text class="mono" x="400" y="294.0" text-anchor="middle" style="fill:#7fbcc2;font-size:13px">0,95</text>
  <line x1="352" y1="395.5" x2="448" y2="395.5" stroke="#7fbcc2" stroke-width="2"/>
  <rect x="48" y="360.0" width="304" height="71" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="66" y="390.0">So she set to work, and very</text>
  <text x="66" y="417.0">soon finished off the cake.</text>
  <rect x="448" y="360.0" width="304" height="71" rx="5" fill="#232320" stroke="#3a3935" stroke-width="1.5"/>
  <text x="466" y="390.0">Então pôs mãos à obra e</text>
  <text x="466" y="417.0">logo acabou com o bolo.</text>
  <rect x="372" y="383.5" width="56" height="24" rx="12" fill="#181816" stroke="#7fbcc2" stroke-width="1.5"/>
  <text class="mono" x="400" y="400.5" text-anchor="middle" style="fill:#7fbcc2;font-size:13px">0,93</text>
  <line x1="48" y1="459.0" x2="752" y2="459.0" stroke="#3a3935" stroke-width="1.5"/>
  <text class="mono" x="48" y="489.0" style="fill:#b4afa6">alinhamento por frase · Alice, cap. 1</text>
</svg>
